<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Lesson | LearnHub LMS</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 23px;
            font-weight: 700;
        }

        .home-link {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .container {
            max-width: 850px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #6b7280;
        }

        .course-name {
            color: #2563eb;
            font-weight: 600;
        }

        .module-name {
            color: #4338ca;
            font-weight: 600;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 7px 25px rgba(0,0,0,.06);
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            outline: none;
        }

        textarea {
            min-height: 220px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        .hint {
            color: #6b7280;
            font-size: 13px;
            margin-top: 6px;
        }

        .button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .back-link {
            display: inline-block;
            margin-top: 18px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        @media (max-width: 600px) {

            .container {
                margin-top: 30px;
            }

            .card {
                padding: 22px;
            }

            .heading h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        🎓 LearnHub LMS
    </div>

    <a
        href="{% url 'course_detail' course.id %}"
        class="home-link"
    >
        Back to Course
    </a>

</nav>


<div class="container">

    <div class="heading">

        <h1>
            Add New Lesson
        </h1>

        <p>
            Add a lesson to
            <span class="course-name">
                {{ course.title }}
            </span>
            under
            <span class="module-name">
                {{ module.title }}
            </span>
        </p>

    </div>


    <div class="card">

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="title">
                    Lesson Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="e.g. Python Variables"
                    required
                >

            </div>


            <div class="form-group">

                <label for="content">
                    Lesson Content
                </label>

                <textarea
                    id="content"
                    name="content"
                    placeholder="Write the lesson content here..."
                    required
                ></textarea>

                <p class="hint">
                    Add explanations, examples and important concepts for students.
                </p>

            </div>


            <button
                type="submit"
                class="button"
            >
                Create Lesson
            </button>

        </form>


        <a
            href="{% url 'course_detail' course.id %}"
            class="back-link"
        >
            ← Back to Course
        </a>

    </div>

</div>

</body>
</html>
