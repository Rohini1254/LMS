<!DOCTYPE html>
<html>
<head>
    <title>Create Account - LearnHub LMS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 7%;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .register-container {
            width: 100%;
            max-width: 450px;
            margin: 55px auto;
            padding: 0 20px;
            flex: 1;
        }

        .register-card {
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .icon {
            text-align: center;
            font-size: 55px;
        }

        h1 {
            text-align: center;
            color: #1f2937;
            margin: 15px 0 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 7px;
            text-align: center;
            margin-bottom: 20px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #374151;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1f2937;
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            background: #1f2937;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #111827;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
        }

        .login-link a {
            color: #1f2937;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .footer {
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 500px) {
            .register-card {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        🎓 LearnHub LMS
    </div>

</nav>


<div class="register-container">

    <div class="register-card">

        <div class="icon">
            🎓
        </div>

        <h1>
            Create Account
        </h1>

        <p class="subtitle">
            Join LearnHub LMS and start learning today.
        </p>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="field">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button type="submit" class="register-btn">
                🎓 Create Account
            </button>

        </form>


        <div class="login-link">

            <p>
                Already have an account?
                <a href="{% url 'login' %}">
                    Login
                </a>
            </p>

        </div>

    </div>

</div>


<footer class="footer">

    <p>
        🎓 LearnHub LMS | Learn • Practice • Grow
    </p>

</footer>

</body>
</html>
