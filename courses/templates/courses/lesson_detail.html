<!DOCTYPE html>
<html>
<head>
    <title>{{ lesson.title }} - LMS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        nav {
            background: #222;
            padding: 15px 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 50px auto;
        }

        .lesson-box {
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .content {
            line-height: 1.7;
            margin-top: 25px;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 18px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<nav>
    <a href="{% url 'course_list' %}">Home</a>
    <a href="{% url 'my_courses' %}">My Courses</a>
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'logout' %}">Logout</a>
</nav>

<div class="container">

    <div class="lesson-box">

        <h1>{{ lesson.title }}</h1>

        <div class="content">
            <p>{{ lesson.content }}</p>
        </div>

        <form method="POST"
              action="{% url 'complete_lesson' lesson.id %}">
            {% csrf_token %}

            <button type="submit">Mark Lesson complete</button>
        </form>

        <br>

        <a href="{% url 'my_courses' %}">
            Back to My Courses
        </a>

    </div>

</div>

</body>
</html>
