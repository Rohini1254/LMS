<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Course | LMS</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .container {
            max-width: 850px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #6b7280;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        .button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .button:hover {
            background: #1d4ed8;
        }

        @media (max-width: 600px) {
            .card {
                padding: 22px;
            }

            .heading h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo">LMS</div>
    <a href="/" class="nav-link">Home</a>
</nav>

<div class="container">

    <div class="heading">
        <h1>Create New Course</h1>
        <p>Add a new course to your learning platform.</p>
    </div>

    <div class="card">

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="title">Course Title</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Enter course title"
                    required
                >
            </div>

            <div class="form-group">
                <label for="description">Course Description</label>
                <textarea
                    id="description"
                    name="description"
                    placeholder="Describe what students will learn..."
                    required
                ></textarea>
            </div>

            <div class="form-group">
                <label for="price">Course Price</label>
                <input
                    type="number"
                    id="price"
                    name="price"
                    placeholder="Enter price"
                    min="0"
                    required
                >
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <input
                    type="text"
                    id="category"
                    name="category"
                    placeholder="e.g. Programming"
                    required
                >
            </div>

            <button type="submit" class="button">
                Create Course
            </button>

        </form>

    </div>

</div>

</body>
</html>
