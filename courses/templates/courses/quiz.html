<!DOCTYPE html>
<html>
<head>
    <title>{{ course.title }} - Quiz</title>
</head>

<body>

<h1>{{ course.title }} Quiz</h1>

<form method="POST">

    {% csrf_token %}

    {% for question in questions %}

        <h3>{{ forloop.counter }}. {{ question.question_text }}</h3>

        <label>
            <input type="radio"
                   name="question_{{ question.id }}"
                   value="{{ question.option_a }}">
            {{ question.option_a }}
        </label>
        <br>

        <label>
            <input type="radio"
                   name="question_{{ question.id }}"
                   value="{{ question.option_b }}">
            {{ question.option_b }}
        </label>
        <br>

        <label>
            <input type="radio"
                   name="question_{{ question.id }}"
                   value="{{ question.option_c }}">
            {{ question.option_c }}
        </label>
        <br>

        <label>
            <input type="radio"
                   name="question_{{ question.id }}"
                   value="{{ question.option_d }}">
            {{ question.option_d }}
        </label>

        <hr>

    {% endfor %}

    <button type="submit">Submit Quiz</button>

</form>

</body>
</html>
