<!DOCTYPE html>
<html>
<head>
    <title>Student Login - LearnHub LMS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 7%;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            margin: 60px auto;
            padding: 0 20px;
            flex: 1;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .icon {
            text-align: center;
            font-size: 55px;
        }

        h1 {
            text-align: center;
            margin: 15px 0 8px;
            color: #1f2937;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 7px;
            text-align: center;
            margin-bottom: 20px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1f2937;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #1f2937;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #111827;
        }

        .links {
            text-align: center;
            margin-top: 25px;
        }

        .links a {
            color: #1f2937;
            text-decoration: none;
            font-weight: bold;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .footer {
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        🎓 LearnHub LMS
    </div>

</nav>


<div class="login-container">

    <div class="login-card">

        <div class="icon">
            🔐
        </div>

        <h1>
            Student Login
        </h1>

        <p class="subtitle">
            Login to continue your learning journey.
        </p>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST" action="{% url 'login' %}">

            {% csrf_token %}


            <div class="field">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit" class="login-btn">
                🔐 Login
            </button>

        </form>


        <div class="links">

            <p>
                Don't have an account?
                <a href="{% url 'register' %}">
                    Create Account
                </a>
            </p>

            <p>
                <a href="/">
                    ← Back to Home
                </a>
            </p>

        </div>

    </div>

</div>


<footer class="footer">

    <p>
        🎓 LearnHub LMS | Learn • Practice • Grow
    </p>

</footer>

</body>
</html>
